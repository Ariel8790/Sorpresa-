<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corazón con tu nombre</title>
<style>
  body {
    background: radial-gradient(circle at center, #ffd6e0 0%, #ffb3c6 50%, #ff8fab 100%);
    font-family: "Courier New", monospace;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    min-height: 100vh;
    text-align: center;
    padding: 1rem;
    box-sizing: border-box;
  }

  h1 {
    color: #fff0f5;
    font-weight: 600;
    margin-bottom: 1rem;
    text-shadow: 0 0 8px #ffd6e0;
    font-size: clamp(1.4rem, 5vw, 2rem);
  }

  input {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    padding: 0.7rem 1rem;
    border-radius: 12px;
    font-size: 1rem;
    outline: none;
    margin-bottom: 1rem;
    text-align: center;
    width: min(250px, 80%);
    backdrop-filter: blur(4px);
  }

  button {
    background: linear-gradient(90deg, #ff4d6d, #ff8097);
    border: none;
    color: #fff;
    padding: 0.7rem 1.4rem;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;
    transition: transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
    font-size: 1rem;
  }
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 18px rgba(255, 153, 173, 0.8);
  }

  pre {
    font-size: clamp(11px, 3vw, 18px);
    line-height: 0.45;
    white-space: pre;
    color: #fff;
    text-shadow: 0 0 8px #ffe0eb, 0 0 20px #ff4d6d;
    margin-top: 1.5rem;
    font-weight: bold;
    letter-spacing: -1.5px;
    max-width: 95vw;
    overflow-x: auto;
  }
</style>
</head>
<body>
  <h1>💖 Pon tu nombre 😊 💖</h1>
  <input type="text" id="nombre" placeholder="Escribe un nombre..." />
  <button onclick="crearCorazon()">Formar corazón</button>
  <pre id="salida"></pre>

<script>
const pattern = `
        
**********           **********

****************     ****************

****************************************

********************************************

***********************************************

*************************************************

*************************************************

***********************************************

********************************************

****************************************

************************************

********************************

****************************

************************

********************

****************

************

********

****

**
`;

function crearCorazon() {
  const nombre = document.getElementById("nombre").value.trim() || "Amor";
  const letras = nombre.split("");
  let corazon = pattern;
  let i = 0;

  while (corazon.includes("*")) {
    corazon = corazon.replace("*", letras[i % letras.length]);
    i++;
  }

  const salida = document.getElementById("salida");
  salida.textContent = corazon + `\n\n💘 Te quiero mucho, ${nombre} 💘`;
}
</script>
</body>
</html>
