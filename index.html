<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorpresa</title>
<style>
  body {
    background: radial-gradient(circle at center, #ffd6e0 0%, #ffb3c6 50%, #ff8fab 100%);
    font-family: 'Poppins', sans-serif;
    color: #590d22;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    min-height: 100vh;
    text-align: center;
    padding: 1.5rem;
    box-sizing: border-box;
    transition: opacity 0.6s ease;
  }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    max-width: 100%;
    line-height: 1.4;
    text-shadow: 0 0 6px #ffb3c6;
  }

  .botones {
    margin-top: 2rem;
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    padding: 0.8rem 1.8rem;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: all 0.3s;
    flex: 1 1 120px;
    max-width: 160px;
  }

  .si {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
  }
  .si:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255, 77, 109, 0.8);
  }

  .no {
    background: #f5f5f5;
    color: #555;
  }
  .no:hover {
    background: #ddd;
    transform: scale(1.03);
  }
</style>
</head>
<body>
  <h1>Antes de que sigas... 💌<br><br>
  Quería sorprenderte con algo que hice con cariño.<br>¿Estás lista, Hacel? 😳</h1>

  <div class="botones">
    <button class="si" onclick="acepta()">Sí 😊</button>
    <button class="no" onclick="rechaza()">No 😞</button>
  </div>

<script>
function acepta() {
  document.body.style.opacity = 0;
  setTimeout(() => {
    window.location.href = "Sorpresa.html";
  }, 600);
}

function rechaza() {
  alert("😢 Oh... bueno, quizá en otra ocasión 💔");
  window.close();
}
</script>
</body>
</html>
